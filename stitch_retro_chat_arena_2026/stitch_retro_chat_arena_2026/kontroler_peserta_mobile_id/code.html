            background: linear-gradient(

                rgba(0, 0, 0, 0.1) 100%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

            clip-path: polygon(

                calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }
        .dpad-shadow {
            box-shadow: 0 4px 0 #000, 4px 0 0 #000, 4px 4px 0 #000;
        }
        .nes-button-shadow {
            box-shadow: 0 6px 0 #5b005b, 0 8px 0 #000;
        }
        .nes-button-shadow:active {
            box-shadow: 0 2px 0 #5b005b, 0 4px 0 #000;
            transform: translateY(4px);
        }
        .terminal-glow {
            text-shadow: 0 0 5px rgba(205, 205, 0, 0.5);
        }
    </style>

                        "tertiary-fixed": "#ffd7f5",
                        "on-tertiary-fixed": "#380038",
                        "on-secondary-container": "#686800",
                        "surface-container-highest": "#333535",
                        "on-background": "#e2e2e2",
                        "secondary": "#ffffff",
                        "tertiary-container": "#3d003d",

                    "spacing": {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "margin-mobile": "16px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Space Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "body-lg": ["JetBrains Mono"],

            },
        }

<style>
        body {
            min-height: max(884px, 100dvh);
        }

<body class="bg-background text-on-background font-body-md selection:bg-tertiary selection:text-on-tertiary overflow-hidden flex flex-col h-screen">
<!-- Header -->
<header class="flex justify-between items-center w-full px-gutter h-16 z-50 bg-background border-b-4 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
<div class="font-headline-lg-mobile text-headline-lg-mobile italic tracking-tighter text-secondary bg-primary px-3 py-1 border-b-4 border-r-4 border-on-background">
        REWIND IT 2026
    </div>
<div class="flex gap-4 items-center">
<span class="material-symbols-outlined text-cyan-neon" data-icon="account_circle">account_circle</span>
<span class="material-symbols-outlined text-yellow-neon" data-icon="settings">settings</span>
</div>
</header>
<!-- Main Console -->
<main class="flex-1 relative flex flex-col p-4 bg-surface-container overflow-hidden">
<!-- Screen Bezel -->
<div class="flex-1 bg-surface-container-highest border-8 border-on-background p-2 rounded-xl shadow-[inset_0_4px_10px_rgba(0,0,0,0.8)] flex flex-col relative">
<div class="flex justify-center mb-2">
<div class="w-16 h-1 bg-on-surface/20 rounded-full"></div>
</div>
<!-- Terminal Screen Area -->
<div class="flex-1 bg-[#1a1c1c] border-4 border-on-background relative flex flex-col p-4 overflow-hidden pixel-corners">
<div class="scanline absolute inset-0 opacity-40 z-10"></div>
<!-- Chat Log -->
<div class="flex-1 font-label-sm text-yellow-neon terminal-glow uppercase tracking-wider overflow-y-auto mb-4 space-y-2">
<div class="flex items-start gap-2">
<span class="text-tertiary">[SYSTEM]:</span>
<span id="typewriter-content">MASUKKAN KOIN UNTUK CHAT_</span>
<span class="inline-block w-2 h-4 bg-yellow-neon cursor-blink align-middle"></span>
</div>
</div>
<!-- Character Selection Area -->
<div class="mt-auto border-t-2 border-on-background/30 pt-4">
<p class="font-label-sm text-label-sm text-cyan-neon mb-3 tracking-widest uppercase">PILIH KARAKTER_</p>
<div class="grid grid-cols-4 gap-3">
<button class="avatar-btn aspect-square bg-surface-container-high border-2 border-on-background flex items-center justify-center hover:bg-tertiary transition-colors group" onclick="selectAvatar(this)">
<span class="material-symbols-outlined text-on-surface group-hover:text-on-tertiary" data-icon="ghost">fitbit_push_ups</span>
</button>
<button class="avatar-btn aspect-square bg-surface-container-high border-2 border-on-background flex items-center justify-center hover:bg-tertiary transition-colors group" onclick="selectAvatar(this)">
<span class="material-symbols-outlined text-on-surface group-hover:text-on-tertiary" data-icon="swords">swords</span>
</button>
<button class="avatar-btn aspect-square bg-tertiary border-2 border-on-background flex items-center justify-center group shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]" onclick="selectAvatar(this)">
<span class="material-symbols-outlined text-on-tertiary" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="avatar-btn aspect-square bg-surface-container-high border-2 border-on-background flex items-center justify-center hover:bg-tertiary transition-colors group" onclick="selectAvatar(this)">
<span class="material-symbols-outlined text-on-surface group-hover:text-on-tertiary" data-icon="joystick">joystick</span>
</button>
</div>
</div>
</div>
<!-- Input Field (Retro Terminal Style) -->
<div class="mt-4 px-1">
<div class="relative">
<div class="absolute inset-y-0 left-3 flex items-center text-cyan-neon font-bold">&gt;&gt;</div>
<input class="w-full bg-surface-container-lowest border-4 border-on-background p-3 pl-10 text-tertiary font-label-sm focus:outline-none placeholder:text-on-surface/30 uppercase" placeholder="Ketik pesan..." type="text"/>
</div>
</div>
</div>
<!-- Tactile Controller Controls -->
<div class="grid grid-cols-2 gap-8 items-center mt-8 mb-24 px-4">
<!-- Improved D-PAD -->
<div class="relative w-36 h-36 mx-auto flex items-center justify-center">
<!-- Horizontal -->
<div class="absolute w-full h-10 bg-on-background dpad-shadow rounded-sm flex justify-between px-1 items-center">
<span class="material-symbols-outlined text-surface text-sm">arrow_left</span>
<span class="material-symbols-outlined text-surface text-sm">arrow_right</span>
</div>
<!-- Vertical -->
<div class="absolute h-full w-10 bg-on-background dpad-shadow rounded-sm flex flex-col justify-between py-1 items-center">
<span class="material-symbols-outlined text-surface text-sm">arrow_drop_up</span>
<span class="material-symbols-outlined text-surface text-sm">arrow_drop_down</span>
</div>
<!-- Center Dot -->
<div class="absolute w-8 h-8 bg-on-background border-2 border-surface-container-highest rounded-full z-10"></div>
</div>
<!-- Improved Action Button (KIRIM) -->
<div class="flex justify-center">
<button class="nes-button-shadow group relative w-32 h-32 rounded-full bg-tertiary border-4 border-on-background transition-all flex items-center justify-center" onclick="triggerSuccess()">
<div class="flex flex-col items-center">
<span class="font-headline-lg text-on-tertiary uppercase tracking-tighter leading-none">KIRIM</span>
<span class="text-[10px] text-on-tertiary/50 font-bold mt-1">PRESS A</span>
</div>
</button>
</div>
</div>
</main>
<!-- Success Overlay -->
<div class="hidden fixed inset-0 z-[100] flex items-center justify-center p-8" id="success-overlay">
<div class="absolute inset-0 bg-background/95 backdrop-blur-sm"></div>
<div class="scanline absolute inset-0 opacity-40"></div>
<div class="relative bg-surface-container border-4 border-on-background p-8 shadow-[12px_12px_0px_0px_rgba(255,171,243,1)] flex flex-col items-center gap-6 text-center pixel-corners">
<div class="flex gap-4">
<span class="material-symbols-outlined text-tertiary text-4xl animate-bounce">rocket_launch</span>
</div>
<h2 class="font-headline-lg text-tertiary uppercase leading-tight">
            PESAN TERKIRIM!<br/>LIHAT LAYAR!
        </h2>
<button class="font-label-sm text-label-sm bg-cyan-neon text-on-background px-8 py-3 border-4 border-on-background shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-1 active:translate-y-1 transition-all uppercase font-bold" onclick="hideSuccess()">
            KEMBALI KE GAME
        </button>
</div>
</div>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-4 pb-safe bg-primary-container border-t-4 border-on-background shadow-[0px_-4px_0px_0px_rgba(0,0,0,1)]">
<div class="flex flex-col items-center justify-center bg-tertiary text-on-tertiary border-2 border-on-background scale-110 -translate-y-2 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-2">
<span class="material-symbols-outlined" data-icon="forum">forum</span>
<span class="font-label-sm text-[10px] font-bold">CHAT</span>
</div>
<div class="flex flex-col items-center justify-center text-on-primary-container hover:text-cyan-neon transition-colors">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-label-sm text-[10px] font-bold">PETA</span>
</div>
<div class="flex flex-col items-center justify-center text-on-primary-container hover:text-yellow-neon transition-colors">
<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
<span class="font-label-sm text-[10px] font-bold">TOKO</span>
</div>
<div class="flex flex-col items-center justify-center text-on-primary-container hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="font-label-sm text-[10px] font-bold">MENU</span>
</div>
</nav>
<script>
    function selectAvatar(btn) {
        document.querySelectorAll('.avatar-btn').forEach(b => {
            b.classList.remove('bg-tertiary', 'shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]');
            b.classList.add('bg-surface-container-high');
            const icon = b.querySelector('span');
            icon.classList.remove('text-on-tertiary');
            icon.classList.add('text-on-surface');
            icon.removeAttribute('style');
        });
        
        btn.classList.add('bg-tertiary', 'shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]');
        btn.classList.remove('bg-surface-container-high');
        const icon = btn.querySelector('span');
        icon.classList.add('text-on-tertiary');
        icon.classList.remove('text-on-surface');
        icon.style.fontVariationSettings = "'FILL' 1";
    }

    function triggerSuccess() {
        document.getElementById('success-overlay').classList.remove('hidden');
    }

    function hideSuccess() {
        document.getElementById('success-overlay').classList.add('hidden');
    }

    const text = "MASUKKAN KOIN UNTUK CHAT_";
    let i = 0;
    const container = document.getElementById('typewriter-content');
    container.innerHTML = "";
    
    function typeWriter() {
        if (i < text.length) {
            container.innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 100);
        }
    }
    
    typeWriter();
</script>
</body></html>
